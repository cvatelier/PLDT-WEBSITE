<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<title>PLDT</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  background: #f8f9fa;
  color: #495057;
}

/* Sidebar */
#sidebar {
  min-width: 220px;
  max-width: 220px;
  height: 100vh;
  background: #343a40;
  color: #fff;
  position: sticky;
  top: 0;
}

#sidebar .nav-link {
  color: #adb5bd;
  border-radius: 6px;
  padding: .45rem .75rem;
  margin-bottom: 6px;
  transition: .2s;
}

#sidebar .nav-link:hover { color:#fff; }

/* Scheduler */
.scheduler-grid {
  display: grid;
  grid-template-columns: 220px repeat(7, 1fr);
  gap: 6px;
  padding: 16px;
}

.scheduler-header {
  font-size: 12px;
  text-align: center;
  font-weight: 600;
}

.employee-name {
  font-weight: 600;
  background: #f1f3f5;
  padding: 8px;
  border-radius: 6px;
}

.scheduler-cell {
  height: 40px;
  background: #e9ecef;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}

.scheduler-cell:hover {
  background: #dee2e6;
}

.block {
  position: absolute;
  inset: 4px;
  border-radius: 6px;
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.block.shift { background:#198754 }
.block.vacation { background:#ffc107; color:#000 }
.block.rest { background:#dc3545 }
.block.job { background:#0d6efd }
/* Week buttons */
.week-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #dee2e6;
  background: #f8f9fa;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.week-btn.active {
  background: #212529;
  color: #fff;
  font-weight: 600;
}

.week-day {
  font-size: 11px;
  text-align: center;
  margin-top: 2px;
  color: #495057;
}
.week-day.today {
  font-weight: 700;
  color: #0d6efd;
}
</style>
</head>
<body>
<div class="d-flex">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="d-flex flex-column p-3">
    <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
      <img src="logo.png" alt="Logo" style="height:40px;width:30px;object-fit:contain" class="me-2">
      <span class="fs-5 fw-bold text-white">PLDT</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="resources.html"><i class="bi bi-person-lines-fill me-2"></i>Resources</a></li>
      <li class="nav-item"><a class="nav-link" href="scheduler.html"><i class="bi bi-calendar-week me-2"></i>Scheduler</a></li>
    </ul>
  </aside>

  <!-- MAIN -->
  <main class="flex-fill p-4">
    <h3>Schedule</h3>
    <div class="d-flex justify-content-between mb-3">
      
      <!-- Week Selector -->
    <div class="d-flex gap-2 mb-3" id="weekSelector"></div>
      <input id="searchInput" class="form-control w-25" placeholder="Search name" onkeyup="renderScheduler()">
    </div>

    <div class="card mt-4">
      <div class="card-header d-flex justify-content-between">
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-secondary" onclick="prevWeek()">‹</button>
          <span id="weekLabel"></span>
          <button class="btn btn-sm btn-outline-secondary" onclick="nextWeek()">›</button>
        </div>
      </div>
      <div id="schedulerGrid" class="scheduler-grid"></div>
    </div>
  </main>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let currentWeek = 0;
const employees = [
  { name: "Aquino, Ralph Allen P." },
  { name: "Abalos, Jose III Q." },
  { name: "Cabiles, Raymond V." },
  { name: "Dacanay, Jayson R." },
  { name: "Dacasin, Edgen Derek C." },
  { name: "De Guzman, Antonio Jr.  Z." },
  { name: "Festejo, Jan Rainier B." },
  { name: "Idio, Christian Kenneth C." },
  { name: "Langit, Timothy C." },
  { name: "Loresco, Allan John S." },
  { name: "Parayno, Armel King F." },
  { name: "Viado, Don Maurice C." },
  { name: "Alanzalon, Jenine Mae G." },
  { name: "Romero, Caesar Jim V." },
  { name: "Mostoles, Aries V." }
];

let schedules = JSON.parse(localStorage.getItem("schedules")) || [];

function prevWeek() { currentWeek--; renderScheduler(); }
function nextWeek() { currentWeek++; renderScheduler(); }

function getWeekDates() {
  const today = new Date();
  const start = new Date(today);
  start.setDate(today.getDate() - today.getDay() + 1 + currentWeek * 7);
  return [...Array(7)].map((_, i) => {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    return d;
  });
}

function renderWeekSelector() {
  const weekContainer = document.getElementById("weekSelector");
  weekContainer.innerHTML = "";
  const today = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const lastDate = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  
  const weeks = [];
  for (let i = 1; i <= lastDate; i += 7) {
    weeks.push(i);
  }

  weeks.forEach((startDay, index) => {
    const btn = document.createElement("div");
    btn.className = "week-btn" + (index === currentWeek ? " active" : "");
    btn.innerHTML = `Week ${index + 1}`;
    
    const days = [...Array(7)].map((_, i) => startDay + i).filter(d => d <= lastDate);
    const dayHtml = days.map(d => {
      const isToday = d === today.getDate();
      return `<div class="week-day${isToday ? " today" : ""}">${d}</div>`;
    }).join("");
    
    btn.innerHTML += `<div class="d-flex gap-1 mt-1">${dayHtml}</div>`;
    
    btn.onclick = () => { currentWeek = index; renderScheduler(); renderWeekSelector(); };
    weekContainer.appendChild(btn);
  });
}

renderWeekSelector();
function renderScheduler() {
  const grid = document.getElementById("schedulerGrid");
  grid.innerHTML = "";

  const days = getWeekDates();
  document.getElementById("weekLabel").innerText =
    days[0].toLocaleDateString("en",{month:"short",day:"numeric"}) +
    " - " +
    days[6].toLocaleDateString("en",{month:"short",day:"numeric"});

  /* Top-left empty cell */
  grid.appendChild(document.createElement("div"));

  /* Week headers */
  days.forEach(d => {
    const h = document.createElement("div");
    h.className = "scheduler-header";
    h.innerText = d.toLocaleDateString("en",{weekday:"short",day:"numeric"});
    grid.appendChild(h);
  });

  /* Employee rows */
  employees.forEach((emp, empIndex) => {
    if(!emp.name.toLowerCase().includes(document.getElementById("searchInput").value.toLowerCase())) return;

    const nameCell = document.createElement("div");
    nameCell.className = "employee-name";
    nameCell.innerText = emp.name;
    grid.appendChild(nameCell);

    days.forEach(d => {
      const cell = document.createElement("div");
      cell.className = "scheduler-cell";
      cell.dataset.employee = empIndex;
      cell.dataset.date = d.toISOString().slice(0,10);

      schedules
        .filter(s => s.employee == empIndex && s.date == cell.dataset.date)
        .forEach(s => {
          const block = document.createElement("div");
          block.className = "block " + s.type;
          block.innerText = s.type.toUpperCase();
          cell.appendChild(block);
        });

      cell.onclick = () => {
        const type = prompt("Enter: shift / vacation / rest / job");
        if(!type) return;

        schedules.push({ employee: empIndex, date: cell.dataset.date, type });
        localStorage.setItem("schedules", JSON.stringify(schedules));
        renderScheduler();
      };

      grid.appendChild(cell);
    });
  });
}

renderScheduler();
</script>
</body>
</html>
