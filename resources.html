<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<title>PLDT</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  background: #f8f9fa;
  color: #495057;
}

/* Sidebar */
#sidebar {
  min-width: 220px;
  max-width: 220px;
  height: 100vh;
  background: #343a40;
  color: #fff;
  position: sticky;
  top: 0;
}

#sidebar .nav-link {
  color: #adb5bd;
  border-radius: 6px;
  padding: .45rem .75rem;
  margin-bottom: 6px;
  transition: .2s;
}

#sidebar .nav-link:hover { color:#fff; }

/* Scheduler */
.scheduler-grid {
  display: grid;
  grid-template-columns: 220px repeat(7, 1fr);
  gap: 6px;
  padding: 16px;
}

.scheduler-header {
  font-size: 12px;
  text-align: center;
  font-weight: 600;
}

.employee-name {
  font-weight: 600;
  background: #f1f3f5;
  padding: 8px;
  border-radius: 6px;
}

.scheduler-cell {
  height: 40px;
  background: #e9ecef;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}

.scheduler-cell:hover {
  background: #dee2e6;
}

.block {
  position: absolute;
  inset: 4px;
  border-radius: 6px;
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.block.shift { background:#198754 }
.block.vacation { background:#ffc107; color:#000 }
.block.rest { background:#dc3545 }
.block.job { background:#0d6efd }
  
/* Week buttons */
.week-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #dee2e6;
  background: #f8f9fa;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.week-btn.active {
  background: #212529;
  color: #fff;
  font-weight: 600;
}

.week-day {
  font-size: 11px;
  text-align: center;
  margin-top: 2px;
  color: #495057;
}
.week-day.today {
  font-weight: 700;
  color: #0d6efd;
}
/* Clean table */
#monthTable {
  border-collapse: separate;
  border-spacing: 4px;
}

#monthTable th {
  background: #f1f3f5;
  font-weight: 600;
  border: none;
}

#monthTable td {
  border: none;
  background: #f8f9fa;
  border-radius: 6px;
  height: 34px;
  cursor: pointer;
  font-size: 11px;
}

/* Sticky columns */
.sticky-col,
.sticky-col-2,
.sticky-col-3 {
  background: #ffffff !important;
  z-index: 3;
}

/* Hover */
.schedule-cell:hover {
  background: #e9ecef;
}

.schedule-cell { font-size:11px; text-align:center; cursor:pointer; }
.legend { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:12px; }
.legend-color { width:16px; height:16px; border-radius:4px; display:inline-block; }

/* Position row accent */
.pos-CXSDA { border-left: 4px solid #0d6efd; }
.pos-WMA   { border-left: 4px solid #6f42c1; }
.pos-WMS   { border-left: 4px solid #fd7e14; }  

/* Schedule cell colors */
#monthTable td.schedule-cell.RD { background:#dc3545; color:#fff; }
#monthTable td.schedule-cell.VL { background:#ffc107; color:#000; }
#monthTable td.schedule-cell.SL { background:#fd7e14; color:#fff; }
#monthTable td.schedule-cell.PL { background:#0d6efd; color:#fff; }
#monthTable td.schedule-cell.ML { background:#6f42c1; color:#fff; }
#monthTable td.schedule-cell.HO { background:#20c997; color:#fff; }
#monthTable td.schedule-cell.LA { background:#adb5bd; color:#000; }
#monthTable td.schedule-cell.D  { background:#198754; color:#fff; }
#monthTable td.schedule-cell.T  { background:#fd149f; color:#fff; }  
</style>
</head>
<body>
<div class="d-flex">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="d-flex flex-column p-3">
    <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
      <img src="logo.png" alt="Logo" style="height:40px;width:30px;object-fit:contain" class="me-2">
      <span class="fs-5 fw-bold text-white">PLDT</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="resources.html"><i class="bi bi-person-lines-fill me-2"></i>Resources</a></li>
      <li class="nav-item"><a class="nav-link" href="scheduler.html"><i class="bi bi-calendar-week me-2"></i>Scheduler</a></li>
    </ul>
  </aside>

<main class="flex-fill p-4">
<div class="d-flex align-items-center justify-content-between mb-3">
  
  <!-- Left: Schedule + Week | Month -->
<div class="d-flex align-items-center gap-3">
  <h3 class="mb-0">Schedule</h3>

  <div class="d-flex align-items-center gap-2">
    <div class="btn-group btn-group-sm">
      <button id="weekViewBtn" class="btn btn-outline-secondary active">Week</button>
      <button id="monthViewBtn" class="btn btn-outline-secondary">Month</button>
    </div>

    <div class="d-flex align-items-center gap-1">
      <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel" class="fw-semibold px-2"></span>
      <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(1)">›</button>
    </div>
  </div>
</div>
  <input type="text" id="searchInput" class="form-control form-control-sm mb-3" placeholder="Search employee..." style="max-width:300px"/>
</div>

    <!-- Employee Actions BELOW schedule -->
    <div class="card-body d-flex justify-content-end gap-2">
      <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#bulkModal">
        <i class="bi bi-pencil-square"></i>
      </button>
      <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
        <i class="bi bi-person-plus"></i>
      </button>
      <button class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#deleteEmployeeModal">
        <i class="bi bi-person-x"></i>
      </button>
    </div>
<!-- Schedule Section -->
<div class="mt-4">
  <div class="card">
    <div class="table-responsive">
      <table class="table table-bordered text-center align-middle small" id="monthTable">
        <thead id="monthHead"></thead>
        <tbody id="monthBody"></tbody>
      </table>
    </div>
  </div>
</div>

</main> 
</div>
  <div class="modal fade" id="bulkModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Bulk Schedule Edit</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">

          <!-- Employees -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Employees</label>
            <select id="bulkEmployees" class="form-select" multiple size="8"></select>
            <small class="text-muted">Ctrl / Shift to select multiple</small>
          </div>

          <!-- Schedule -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">Schedule Code</label>
            <select id="bulkCode" class="form-select">
              <option value="">-- Select --</option>
              <option>RD</option>
              <option>VL</option>
              <option>SL</option>
              <option>PL</option>
              <option>ML</option>
              <option>HO</option>
              <option>LA</option>
              <option>D</option>
              <option>T</option>
            </select>
          </div>

          <!-- Date Range -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">From</label>
            <input type="date" id="bulkFrom" class="form-control">
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">To</label>
            <input type="date" id="bulkTo" class="form-control">
          </div>

        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="applyBulkEdit()">Apply</button>
      </div>

    </div>
  </div>
</div>
<div class="modal fade" id="addEmployeeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Add Employee</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div class="row g-3">

          <div class="col-12">
            <label class="form-label">Cluster</label>
            <input id="empCluster" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label">ID Number</label>
            <input id="empId" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label">Name</label>
            <input id="empName" class="form-control">
          </div>

          <div class="col-12">
            <label class="form-label">Position</label>
            <select id="empPosition" class="form-select">
              <option>CXSDA</option>
              <option>WMA</option>
              <option>WMS</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">VL Count</label>
            <input id="empVL" class="form-control">
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-success" onclick="addEmployee()">Add</button>
      </div>
</div>
</div>
</div>

<!-- ✅ DELETE EMPLOYEE MODAL (SEPARATE) -->
<div class="modal fade" id="deleteEmployeeModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title text-danger">Delete Employee</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <label class="form-label fw-semibold">Select Employee</label>
        <select id="deleteEmployeeSelect" class="form-select"></select>

        <div class="alert alert-warning mt-3 small">
          This action will permanently remove the employee and their schedules.
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger" onclick="deleteEmployee()">Delete</button>
      </div>

    </div>
  </div>
</div>
  
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ========== DATA ========== */
  let employees = JSON.parse(localStorage.getItem("employees")) || [
    { cluster:"Cluster 2", id:"548578", name:"Aquino, Ralph Allen P.", position:"CXSDA" },
    { cluster:"Cluster 2", id:"548576", name:"Abalos, Jose III Q.", position:"CXSDA" },
    { cluster:"Cluster 2", id:"548581", name:"Cabiles, Raymond V.", position:"CXSDA" },
    { cluster:"Cluster 2", id:"546523", name:"Alanzalon, Jenine Mae G.", position:"WMA" },
    { cluster:"Cluster 2", id:"548595", name:"Romero, Caesar Jim V.", position:"WMA" },
    { cluster:"Cluster 2", id:"541691", name:"Mostoles, Aries V.", position:"WMS" }
  ];

  const scheduleOptions = ["RD","VL","SL","PL","ML","HO","LA","D","T"];
  const weekDays = ["M","T","W","T","F","S","S"];

  let viewMode = "week";
  let currentDate = new Date();
  let schedules = JSON.parse(localStorage.getItem("monthSchedules")) || {};

  /* ========== DOM REFS ========== */
  const weekBtn  = document.getElementById("weekViewBtn");
  const monthBtn = document.getElementById("monthViewBtn");
  const searchInput = document.getElementById("searchInput");
  const bulkEmployees = document.getElementById("bulkEmployees");
  const deleteEmployeeSelect = document.getElementById("deleteEmployeeSelect");

  const empCluster  = document.getElementById("empCluster");
  const empId       = document.getElementById("empId");
  const empName     = document.getElementById("empName");
  const empPosition = document.getElementById("empPosition");

  /* ========== INIT DROPDOWNS ========== */
  function refreshBulkEmployees(){
    bulkEmployees.innerHTML = "";
    employees.forEach((e,i)=>{
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${e.name} (${e.position})`;
      bulkEmployees.appendChild(opt);
    });
  }

  function refreshDeleteEmployees(){
    deleteEmployeeSelect.innerHTML = "";
    employees.forEach((e,i)=>{
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = `${e.name} (${e.position})`;
      deleteEmployeeSelect.appendChild(opt);
    });
  }

  refreshBulkEmployees();
  refreshDeleteEmployees();

  /* ========== HELPERS ========== */
  function save(){
    localStorage.setItem("monthSchedules", JSON.stringify(schedules));
    localStorage.setItem("employees", JSON.stringify(employees));
  }

  function mondayOfWeek(date){
    const d = new Date(date);
    const day = (d.getDay()+6)%7;
    d.setDate(d.getDate()-day);
    return d;
  }

  function weeksInMonth(year, month){
    const first = new Date(year, month, 1).getDay();
    const days = new Date(year, month+1,0).getDate();
    const offset = (first+6)%7;
    return Math.ceil((days+offset)/7);
  }

  /* ========== SEARCH ========== */
  function applySearchFilter(keyword){
    const term = keyword.toLowerCase();
    document.querySelectorAll("#monthBody tr").forEach(row=>{
      row.style.display = row.innerText.toLowerCase().includes(term) ? "" : "none";
    });
  }

  searchInput.addEventListener("input", () =>
    applySearchFilter(searchInput.value)
  );

  /* ========== NAVIGATION ========== */
  window.changeMonth = dir => {
    if(viewMode === "month"){
      currentDate.setMonth(currentDate.getMonth()+dir);
      renderMonth();
    } else {
      currentDate.setDate(currentDate.getDate()+dir*7);
      renderWeek();
    }
  };

  weekBtn.onclick = () => {
    viewMode="week";
    weekBtn.classList.add("active");
    monthBtn.classList.remove("active");
    renderWeek();
  };

  monthBtn.onclick = () => {
    viewMode="month";
    currentDate.setDate(1);
    monthBtn.classList.add("active");
    weekBtn.classList.remove("active");
    renderMonth();
  };

  /* ========== ADD EMPLOYEE ========== */
  window.addEmployee = () => {
    const cluster = empCluster.value.trim();
    const id = empId.value.trim();
    const name = empName.value.trim();
    const position = empPosition.value;

    if(!cluster || !id || !name){
      alert("Please complete all fields.");
      return;
    }

    employees.push({ cluster, id, name, position });
    save();

    refreshBulkEmployees();
    refreshDeleteEmployees();

    viewMode==="month" ? renderMonth() : renderWeek();

    bootstrap.Modal.getInstance(
      document.getElementById("addEmployeeModal")
    ).hide();

    empCluster.value = empId.value = empName.value = "";
  };

  /* ========== DELETE EMPLOYEE ========== */
  window.deleteEmployee = () => {
    const index = deleteEmployeeSelect.value;
    if(index === "") return;

    const emp = employees[index];
    if(!confirm(`Delete ${emp.name}? This cannot be undone.`)) return;

    employees.splice(index,1);

    Object.keys(schedules).forEach(monthKey=>{
      Object.keys(schedules[monthKey]).forEach(k=>{
        if(k.startsWith(index+"-")) delete schedules[monthKey][k];
      });
    });

    const newSchedules = {};
    Object.keys(schedules).forEach(monthKey=>{
      newSchedules[monthKey] = {};
      Object.keys(schedules[monthKey]).forEach(k=>{
        const [empIdx, day] = k.split("-");
        if(empIdx > index){
          newSchedules[monthKey][`${empIdx-1}-${day}`] = schedules[monthKey][k];
        } else if(empIdx < index){
          newSchedules[monthKey][k] = schedules[monthKey][k];
        }
      });
    });
    schedules = newSchedules;

    save();

    refreshBulkEmployees();
    refreshDeleteEmployees();

    viewMode==="month" ? renderMonth() : renderWeek();
    applySearchFilter(searchInput.value);

    bootstrap.Modal.getInstance(
      document.getElementById("deleteEmployeeModal")
    ).hide();
  };

  /* ========== MONTH VIEW ========== */
  function renderMonth(){
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month+1,0).getDate();
    const firstDay = new Date(year, month,1).getDay();
    const startOffset = (firstDay+6)%7;
    const weeks = weeksInMonth(year, month);
    const totalCells = weeks*7;
    const key = `${year}-${month}`;

    document.getElementById("monthLabel").innerText =
      currentDate.toLocaleDateString("en",{month:"long",year:"numeric"});

    const head = document.getElementById("monthHead");
    const body = document.getElementById("monthBody");
    head.innerHTML = "";
    body.innerHTML = "";

    let r1 = `<tr>
      <th rowspan="3">Cluster</th>
      <th rowspan="3">ID</th>
      <th rowspan="3">Name</th>
      <th rowspan="3">Position</th>
      <th rowspan="3">VL</th>`;
    for(let w=1; w<=weeks; w++) r1+=`<th colspan="7">Week ${w}</th>`;
    r1+=`</tr>`;

    let r2 = `<tr>`;
    for(let i=0;i<totalCells;i++) r2+=`<th>${weekDays[i%7]}</th>`;
    r2+=`</tr>`;

    let r3 = `<tr>`;
    for(let i=0;i<totalCells;i++){
      const d=i-startOffset+1;
      r3+=`<th>${d>0&&d<=daysInMonth?d:""}</th>`;
    }
    r3+=`</tr>`;

    head.innerHTML = r1+r2+r3;

    employees.forEach((emp,empIndex)=>{
      let tr = `<tr>
        <td>${emp.cluster}</td>
        <td>${emp.id}</td>
        <td class="text-start">${emp.name}</td>
        <td>${emp.position}</td>
        <td></td>`;
      for(let i=0;i<totalCells;i++){
        const day=i-startOffset+1;
        const id=(day>0&&day<=daysInMonth)?`${empIndex}-${day}`:"";
        const val=id?schedules[key]?.[id]||"":"";
        tr+=`<td class="schedule-cell ${val}" data-key="${key}" data-id="${id}">${val}</td>`;
      }
      tr+=`</tr>`;
      body.insertAdjacentHTML("beforeend", tr);
    });

    bindClicks();
    applySearchFilter(searchInput.value);
  }

  /* ========== WEEK VIEW ========== */
  function renderWeek(){
    const start = mondayOfWeek(currentDate);
    const key = `${start.getFullYear()}-${start.getMonth()}`;

    document.getElementById("monthLabel").innerText =
      `Week of ${start.toLocaleDateString()}`;

    const head=document.getElementById("monthHead");
    const body=document.getElementById("monthBody");
    head.innerHTML=""; body.innerHTML="";

    let h1=`<tr>
      <th>Cluster</th><th>ID</th><th>Name</th><th>Position</th><th>VL</th>`;
    for(let i=0;i<7;i++) h1+=`<th>${weekDays[i]}</th>`;
    h1+=`</tr>`;

    let h2=`<tr><th></th><th></th><th></th><th></th><th></th>`;
    for(let i=0;i<7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      h2+=`<th>${d.getDate()}</th>`;
    }
    h2+=`</tr>`;

    head.innerHTML=h1+h2;

    employees.forEach((emp,empIndex)=>{
      let tr=`<tr>
        <td>${emp.cluster}</td>
        <td>${emp.id}</td>
        <td class="text-start">${emp.name}</td>
        <td>${emp.position}</td>
        <td></td>`;
      for(let i=0;i<7;i++){
        const d=new Date(start); d.setDate(start.getDate()+i);
        const id=`${empIndex}-${d.getDate()}`;
        const val=schedules[key]?.[id]||"";
        tr+=`<td class="schedule-cell ${val}" data-key="${key}" data-id="${id}">${val}</td>`;
      }
      tr+=`</tr>`;
      body.insertAdjacentHTML("beforeend", tr);
    });

    bindClicks();
    applySearchFilter(searchInput.value);
  }

  /* ========== CELL EDITING ========== */
  function bindClicks(){
    document.querySelectorAll(".schedule-cell").forEach(cell=>{
      cell.onclick=()=>{
        if(!cell.dataset.id||cell.querySelector("select")) return;
        const select=document.createElement("select");
        select.style.width="100%";
        select.style.border="none";
        select.innerHTML=`<option></option>`+
          scheduleOptions.map(o=>`<option>${o}</option>`).join("");
        cell.innerText="";
        cell.appendChild(select);
        select.focus();

select.onchange = () => {
  schedules[cell.dataset.key] ??= {};

  if (select.value) {
    schedules[cell.dataset.key][cell.dataset.id] = select.value;
  } else {
    delete schedules[cell.dataset.key][cell.dataset.id];
  }

  save();

  // ✅ re-render based on current view
  if (viewMode === "month") {
    renderMonth();
  } else {
    renderWeek();
  }
};
      };
    });
  }

  /* ========== INIT ========== */
  renderWeek();

});
</script>
</body>
</html>
