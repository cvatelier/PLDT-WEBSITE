<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<title>PLDT</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>
body {
  font-family: "Segoe UI", sans-serif;
  font-size: 14px;
  background: #f8f9fa;
  color: #495057;
}

/* Sidebar */
#sidebar {
  min-width: 220px;
  max-width: 220px;
  height: 100vh;
  background: #343a40;
  color: #fff;
  position: sticky;
  top: 0;
}

#sidebar .nav-link {
  color: #adb5bd;
  border-radius: 6px;
  padding: .45rem .75rem;
  margin-bottom: 6px;
  transition: .2s;
}

#sidebar .nav-link:hover { color:#fff; }

/* Scheduler */
.scheduler-grid {
  display: grid;
  grid-template-columns: 220px repeat(7, 1fr);
  gap: 6px;
  padding: 16px;
}

.scheduler-header {
  font-size: 12px;
  text-align: center;
  font-weight: 600;
}

.employee-name {
  font-weight: 600;
  background: #f1f3f5;
  padding: 8px;
  border-radius: 6px;
}

.scheduler-cell {
  height: 40px;
  background: #e9ecef;
  border-radius: 6px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
}

.scheduler-cell:hover {
  background: #dee2e6;
}

.block {
  position: absolute;
  inset: 4px;
  border-radius: 6px;
  color: #fff;
  font-size: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.block.shift { background:#198754 }
.block.vacation { background:#ffc107; color:#000 }
.block.rest { background:#dc3545 }
.block.job { background:#0d6efd }
  
/* Week buttons */
.week-btn {
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #dee2e6;
  background: #f8f9fa;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
}

.week-btn.active {
  background: #212529;
  color: #fff;
  font-weight: 600;
}

.week-day {
  font-size: 11px;
  text-align: center;
  margin-top: 2px;
  color: #495057;
}
.week-day.today {
  font-weight: 700;
  color: #0d6efd;
}
/* Clean table */
#monthTable {
  border-collapse: separate;
  border-spacing: 4px;
}

#monthTable th {
  background: #f1f3f5;
  font-weight: 600;
  border: none;
}

#monthTable td {
  border: none;
  background: #f8f9fa;
  border-radius: 6px;
  height: 34px;
  cursor: pointer;
  font-size: 11px;
}

/* Sticky columns */
.sticky-col,
.sticky-col-2,
.sticky-col-3 {
  background: #ffffff !important;
  z-index: 3;
}

/* Hover */
.schedule-cell:hover {
  background: #e9ecef;
}

/* Schedule cell colors for each code */
.schedule-cell.RD { background:#dc3545; color:#fff; }
.schedule-cell.VL { background:#ffc107; color:#000; }
.schedule-cell.SL { background:#fd7e14; color:#fff; }
.schedule-cell.PL { background:#0d6efd; color:#fff; }
.schedule-cell.ML { background:#6f42c1; color:#fff; }
.schedule-cell.HO { background:#20c997; color:#fff; }
.schedule-cell.LA { background:#adb5bd; color:#000; }
.schedule-cell.D  { background:#198754; color:#fff; }
.schedule-cell.T  { background:#fd149f; color:#fff; }

.schedule-cell { font-size:11px; text-align:center; cursor:pointer; }
.legend { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:4px; font-size:12px; }
.legend-color { width:16px; height:16px; border-radius:4px; display:inline-block; }

/* Position row accent */
.pos-CXSDA { border-left: 4px solid #0d6efd; }
.pos-WMA   { border-left: 4px solid #6f42c1; }
.pos-WMS   { border-left: 4px solid #fd7e14; }  
</style>
</head>
<body>
<div class="d-flex">
  <!-- SIDEBAR -->
  <aside id="sidebar" class="d-flex flex-column p-3">
    <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
      <img src="logo.png" alt="Logo" style="height:40px;width:30px;object-fit:contain" class="me-2">
      <span class="fs-5 fw-bold text-white">PLDT</span>
    </a>

    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="resources.html"><i class="bi bi-person-lines-fill me-2"></i>Resources</a></li>
      <li class="nav-item"><a class="nav-link" href="scheduler.html"><i class="bi bi-calendar-week me-2"></i>Scheduler</a></li>
    </ul>
  </aside>

<main class="flex-fill p-4">
<div class="d-flex align-items-center justify-content-between mb-3">
  
  <!-- Left: Schedule + Week | Month -->
  <div class="d-flex align-items-center gap-3">
    <h3 class="mb-0">Schedule</h3>
    <div class="btn-group btn-group-sm">
      <button id="weekViewBtn" class="btn btn-outline-secondary active">Week</button>
      <button id="monthViewBtn" class="btn btn-outline-secondary">Month</button>
    </div>
  </div>

<!-- Month Navigation Controls -->
<div class="d-flex align-items-center gap-2 mb-2">
  <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(-1)">‹</button>
  <span id="monthLabel" class="fw-semibold"></span>
  <button class="btn btn-sm btn-outline-secondary" onclick="changeMonth(1)">›</button>
</div>
  
  <!-- Week selector + search -->
  <div class="d-flex justify-content-between mb-3">
    <input type="text" id="searchInput"class="form-control form-control-sm"placeholder="Search employee, position, or cluster">
  </div>
</div>
  <div class="d-flex gap-2" id="weekSelector"></div>

<!-- Scheduler card --> 
<div class="card mt-4">
  <div class="card-header fw-semibold">
    Monthly Schedule
  </div>
  <!-- Only one table for month -->
<div class="table-responsive">
  <table class="table table-bordered text-center align-middle small" id="monthTable">
    <thead id="monthHead"></thead>
    <tbody id="monthBody"></tbody>
  </table>
  </div>
</div>
</main> 
</div>
  
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* ================= DATA ================= */
  const employees = [
    { cluster:"Cluster 2", id:"", name:"Aquino, Ralph Allen P.", position:"CXSDA", vl:"" },
    { cluster:"Cluster 2", id:"", name:"Abalos, Jose III Q.", position:"CXSDA", vl:"" },
    { cluster:"Cluster 2", id:"", name:"Cabiles, Raymond V.", position:"CXSDA", vl:""  },
    { cluster:"Cluster 2", id:"", name:"Alanzalon, Jenine Mae G.", position:"WMA", vl:""  },
    { cluster:"Cluster 2", id:"", name:"Romero, Caesar Jim V.", position:"WMA", vl:""  },
    { cluster:"Cluster 2", id:"", name:"Mostoles, Aries V.", position:"WMS", vl:""  }
  ];

  const scheduleOptions = ["RD","VL","SL","PL","ML","HO","LA","D","T"];
  const weekDays = ["M","T","W","T","F","S","S"];

  let viewMode = "week"; // week | month
  let currentDate = new Date();
  let schedules = JSON.parse(localStorage.getItem("monthSchedules")) || {};

  const weekBtn  = document.getElementById("weekViewBtn");
  const monthBtn = document.getElementById("monthViewBtn");

  const searchInput = document.getElementById("searchInput");

  searchInput.addEventListener("input", () => {
  applySearchFilter(searchInput.value);
  });

  /* ================= HELPERS ================= */
  function save() {
    localStorage.setItem("monthSchedules", JSON.stringify(schedules));
  }

  function mondayOfWeek(date) {
    const d = new Date(date);
    const day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return d;
  }

  function weeksInMonth(year, month) {
    const first = new Date(year, month, 1).getDay();
    const days = new Date(year, month + 1, 0).getDate();
    const offset = (first + 6) % 7;
    return Math.ceil((days + offset) / 7);
  }

  /* ================= NAVIGATION ================= */
  window.changeMonth = (dir) => {
    if (viewMode === "month") {
      currentDate.setMonth(currentDate.getMonth() + dir);
      renderMonth();
    } else {
      currentDate.setDate(currentDate.getDate() + dir * 7);
      renderWeek();
    }
  };

  weekBtn.onclick = () => {
    viewMode = "week";
    weekBtn.classList.add("active");
    monthBtn.classList.remove("active");
    renderWeek();
  };

  monthBtn.onclick = () => {
    viewMode = "month";
    currentDate.setDate(1); // IMPORTANT
    monthBtn.classList.add("active");
    weekBtn.classList.remove("active");
    renderMonth();
  };

  /* ================= MONTH VIEW ================= */
  function renderMonth() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();
    const startOffset = (firstDay + 6) % 7;
    const weeks = weeksInMonth(year, month);
    const totalCells = weeks * 7;
    const key = `${year}-${month}`;

    document.getElementById("monthLabel").innerText =
      currentDate.toLocaleDateString("en", { month:"long", year:"numeric" });

    const head = document.getElementById("monthHead");
    const body = document.getElementById("monthBody");
    head.innerHTML = "";
    body.innerHTML = "";

    /* Headers */
    let r1 = `<tr>
      <th rowspan="3">Cluster</th>
      <th rowspan="3">ID Number</th>
      <th rowspan="3">Name</th>
      <th rowspan="3">Position</th>
      <th rowspan="3">VL Count</th>`;
    for (let w = 1; w <= weeks; w++) r1 += `<th colspan="7">WEEK ${w}</th>`;
    r1 += `</tr>`;

    let r2 = `<tr>`;
    for (let i = 0; i < totalCells; i++) r2 += `<th>${weekDays[i % 7]}</th>`;
    r2 += `</tr>`;

    let r3 = `<tr>`;
    for (let i = 0; i < totalCells; i++) {
      const day = i - startOffset + 1;
      r3 += `<th>${day > 0 && day <= daysInMonth ? day : ""}</th>`;
    }
    r3 += `</tr>`;

    head.innerHTML = r1 + r2 + r3;

    employees.forEach((emp, empIndex) => {
      let tr = `<tr class="pos-${emp.position}">
        <td>${emp.cluster}</td>
        <td class="text-start">${emp.name}</td>
        <td>${emp.position}</td>`;

      for (let i = 0; i < totalCells; i++) {
        const day = i - startOffset + 1;
        const id = (day > 0 && day <= daysInMonth) ? `${empIndex}-${day}` : "";
        const val = id ? schedules[key]?.[id] || "" : "";

        tr += `<td class="schedule-cell ${val}"
          data-key="${key}"
          data-id="${id}">${val}</td>`;
      }
      tr += `</tr>`;
      body.insertAdjacentHTML("beforeend", tr);
    });

    bindClicks();
    applySearchFilter(searchInput.value);
  }

  /* ================= WEEK VIEW ================= */
  function renderWeek() {
    const start = mondayOfWeek(currentDate);
    const key = `${start.getFullYear()}-${start.getMonth()}`;

    document.getElementById("monthLabel").innerText =
      `Week of ${start.toLocaleDateString()}`;

    const head = document.getElementById("monthHead");
    const body = document.getElementById("monthBody");
    head.innerHTML = "";
    body.innerHTML = "";

    let h1 = `<tr>
      <th>CLUSTER</th>
      <th>NAME</th>
      <th>POSITION</th>`;
    for (let i = 0; i < 7; i++) h1 += `<th>${weekDays[i]}</th>`;
    h1 += `</tr>`;

    let h2 = `<tr><th></th><th></th><th></th>`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      h2 += `<th>${d.getDate()}</th>`;
    }
    h2 += `</tr>`;

    head.innerHTML = h1 + h2;

    employees.forEach((emp, empIndex) => {
      let tr = `<tr class="pos-${emp.position}">
        <td>${emp.cluster}</td>
        <td class="text-start">${emp.name}</td>
        <td>${emp.position}</td>`;

      for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        const id = `${empIndex}-${d.getDate()}`;
        const val = schedules[key]?.[id] || "";

        tr += `<td class="schedule-cell ${val}"
          data-key="${key}"
          data-id="${id}">${val}</td>`;
      }
      tr += `</tr>`;
      body.insertAdjacentHTML("beforeend", tr);
    });

    bindClicks();
    applySearchFilter(searchInput.value);
  }
  
  function applySearchFilter(keyword) {
  const term = keyword.toLowerCase();

  document.querySelectorAll("#monthBody tr").forEach(row => {
    const text = row.innerText.toLowerCase();
    row.style.display = text.includes(term) ? "" : "none";
  });
}
  
  /* ================= CELL DROPDOWN ================= */
  function bindClicks() {
    document.querySelectorAll(".schedule-cell").forEach(cell => {
      cell.onclick = () => {
        if (!cell.dataset.id || cell.querySelector("select")) return;

        const select = document.createElement("select");
        select.style.width = "100%";
        select.style.height = "100%";
        select.style.border = "none";
        select.style.background = "transparent";
        select.style.fontSize = "11px";

        select.innerHTML =
          `<option value=""></option>` +
          scheduleOptions.map(o => `<option>${o}</option>`).join("");

        cell.innerText = "";
        cell.appendChild(select);
        select.focus();

        select.onchange = () => {
          const key = cell.dataset.key;
          schedules[key] ??= {};
          scheduleOptions.forEach(c => cell.classList.remove(c));

          if (!select.value) {
            delete schedules[key][cell.dataset.id];
            cell.innerText = "";
          } else {
            schedules[key][cell.dataset.id] = select.value;
            cell.classList.add(select.value);
            cell.innerText = select.value;
          }
          save();
          select.remove();
        };

        select.onblur = () => {
          select.remove();
          const val = schedules[cell.dataset.key]?.[cell.dataset.id];
          cell.innerText = val || "";
          if (val) cell.classList.add(val);
        };
      };
    });
  }

  /* ================= INIT ================= */
  renderWeek(); // ONLY initial render

});
</script>
</body>
</html>
