<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Scheduler</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<!-- Flatpickr CSS -->
<link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

<style>
body { font-family:"Segoe UI", sans-serif; background:#f4f5f7; }
.table thead th { background:#fff; position: sticky; top: 0; z-index: 2; }
.status-Active { background:#d4edda; color:#155724; padding:3px 6px; border-radius:0.25rem; }
.status-Vacation { background:#fff3cd; color:#856404; padding:3px 6px; border-radius:0.25rem; }
.status-Inactive { background:#f8d7da; color:#721c24; padding:3px 6px; border-radius:0.25rem; }
.modal-label { font-weight:600; }
body {
  font-family: "Segoe UI", sans-serif;
  background: #f4f5f7;
  margin: 0;
}

/* ===== Sidebar ===== */
#sidebar {
  min-width: 220px;
  max-width: 220px;
  height: 100vh;
  background: #343a40;
  color: #fff;
  position: sticky;
  top: 0;
  padding: 1rem;
}

#sidebar .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.5rem;
}

#sidebar .brand span {
  font-size: 1.1rem;
  font-weight: 700;
}

#sidebar .nav-link {
  color: #adb5bd;
  border-radius: 6px;
  margin-bottom: 6px;
  padding: 0.45rem 0.75rem;
  transition: 0.2s;
}

#sidebar .nav-link:hover,
#sidebar .nav-link.active {
  background: #495057;
  color: #fff;
  font-weight: 500;
}

/* ===== Main ===== */
main {
  flex: 1;
  padding: 1.5rem 2rem;
}

/* Table tweaks */
.table thead th {
  background: #fff;
  position: sticky;
  top: 0;
  z-index: 2;
}

.status-Active {
  background:#d4edda;
  color:#155724;
  padding:3px 6px;
  border-radius:0.25rem;
}
.status-Vacation {
  background:#fff3cd;
  color:#856404;
  padding:3px 6px;
  border-radius:0.25rem;
}
.status-Inactive {
  background:#f8d7da;
  color:#721c24;
  padding:3px 6px;
  border-radius:0.25rem;
}

/* Responsive sidebar */
@media (max-width: 992px) {
  #sidebar {
    position: fixed;
    transform: translateX(-100%);
    transition: 0.3s;
    z-index: 1030;
  }
  #sidebar.show {
    transform: translateX(0);
  }
}
</style>
</head>
<body>

<div class="container py-4">
  <h1 class="mb-3">Employee Scheduler</h1>
  <div class="mb-3 d-flex justify-content-between">
    <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#editModal" onclick="openAddModal()">
      <i class="bi bi-plus-circle"></i> Add Employee
    </button>
    <input type="text" id="searchInput" class="form-control w-25" placeholder="Search by name" onkeyup="renderTable()">
  </div>

  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Cluster</th>
          <th>Vacation</th>
          <th>Shift</th>
          <th>Job</th>
          <th>Rest Days</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="employeeTable"></tbody>
    </table>
  </div>
</div>

<!-- Edit/Add Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Edit Employee</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="employeeIndex">
        <div class="mb-2">
          <label class="modal-label">Name</label>
          <input type="text" id="empName" class="form-control">
        </div>
        <div class="mb-2">
          <label class="modal-label">Role</label>
          <input type="text" id="empRole" class="form-control">
        </div>
        <div class="mb-2">
          <label class="modal-label">Cluster</label>
          <input type="text" id="empCluster" class="form-control">
        </div>
        <div class="mb-2">
          <label class="modal-label">Vacation</label>
          <div class="d-flex gap-2">
            <input type="text" id="vacStart" class="form-control" placeholder="Start">
            <input type="text" id="vacEnd" class="form-control" placeholder="End">
          </div>
        </div>
        <div class="mb-2">
          <label class="modal-label">Shift</label>
          <div class="d-flex gap-2">
            <input type="text" id="shiftStart" class="form-control" placeholder="Start">
            <input type="text" id="shiftEnd" class="form-control" placeholder="End">
          </div>
        </div>
        <div class="mb-2">
          <label class="modal-label">Job</label>
          <input type="text" id="empJob" class="form-control">
        </div>
        <div class="mb-2">
          <label class="modal-label">Rest Days</label>
          <select id="empRestDays" class="form-select" multiple>
            <option value="Sunday">Sunday</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="modal-label">Status</label>
          <select id="empStatus" class="form-select">
            <option>Active</option>
            <option>Vacation</option>
            <option>Inactive</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="saveEmployee()">Save</button>
      </div>
    </div>
  </div>
</div>
