<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<title>PLDT Scheduler</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<!-- FullCalendar -->
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">

<style>
body{
  font-family:"Segoe UI",sans-serif;
  background:#f8f9fa;
}

/* Sidebar */
#sidebar{
  width:220px;
  background:#343a40;
  color:#fff;
  min-height:100vh;
}
#sidebar .nav-link{color:#adb5bd}
#sidebar .nav-link:hover{color:#fff}

/* Status */
.status-Active{background:#d4edda;color:#155724;padding:4px 6px;border-radius:4px}
.status-Vacation{background:#fff3cd;color:#856404;padding:4px 6px;border-radius:4px}
.status-Inactive{background:#f8d7da;color:#721c24;padding:4px 6px;border-radius:4px}

/* Scheduler */
.scheduler-grid{
  display:grid;
  grid-template-columns:repeat(7,36px);
  gap:6px;
  padding:16px;
}
.scheduler-header{
  font-size:12px;
  text-align:center;
  font-weight:600;
}
.scheduler-cell{
  width:36px;
  height:36px;
  background:#e9ecef;
  border-radius:6px;
  cursor:pointer;
  position:relative;
}
.scheduler-cell.dragging{
  outline:2px solid #0d6efd;
}
.block{
  position:absolute;
  inset:4px;
  border-radius:6px;
  color:#fff;
  font-size:10px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
}
.block.shift{background:#198754}
.block.vacation{background:#ffc107;color:#000}
.block.rest{background:#dc3545}
.block.job{background:#0d6efd}
</style>
</head>

<body>
<div class="d-flex">

<!-- SIDEBAR -->
<aside id="sidebar" class="p-3">
  <h5 class="text-white mb-3">PLDT</h5>
  <ul class="nav flex-column">
    <li class="nav-item"><a class="nav-link" href="#">Dashboard</a></li>
    <li class="nav-item"><a class="nav-link" href="#">Resources</a></li>
    <li class="nav-item"><a class="nav-link active" href="#">Scheduler</a></li>
  </ul>
</aside>

<!-- MAIN -->
<main class="flex-fill p-4">

<h3>Employee Scheduler</h3>

<div class="d-flex justify-content-between mb-3">
  <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#editModal" onclick="openAddModal()">
    <i class="bi bi-plus-circle"></i> Add Employee
  </button>
  <input id="searchInput" class="form-control w-25" placeholder="Search name" onkeyup="renderTable()">
</div>

<!-- TABLE -->
<div class="table-responsive bg-white shadow-sm rounded">
<table class="table mb-0">
<thead class="table-light">
<tr>
<th>Name</th><th>Role</th><th>Cluster</th><th>Rest Days</th><th>Status</th><th>Actions</th>
</tr>
</thead>
<tbody id="employeeTable"></tbody>
</table>
</div>

<!-- SCHEDULER -->
<div class="card mt-4">
<div class="card-header d-flex justify-content-between">
<strong>Schedule (No Time)</strong>
<div class="d-flex gap-2">
<select id="employeeFilter" class="form-select form-select-sm"></select>
<button class="btn btn-sm btn-outline-secondary" onclick="prevWeek()">‹</button>
<span id="weekLabel"></span>
<button class="btn btn-sm btn-outline-secondary" onclick="nextWeek()">›</button>
</div>
</div>
<div id="schedulerGrid" class="scheduler-grid"></div>
</div>

<!-- CALENDAR -->
<div class="card mt-4">
<div class="card-header d-flex justify-content-between">
<strong id="calendarTitle">Employee Calendar</strong>
<select id="employeeSelect" class="form-select w-25" onchange="loadEmployeeCalendar()"></select>
</div>
<div class="card-body">
<div id="calendar"></div>
</div>
</div>

</main>
</div>

<!-- ASSIGN MODAL -->
<div class="modal fade" id="assignModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5>Assign Schedule</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<select id="assignType" class="form-select">
<option value="shift">Shift</option>
<option value="vacation">Vacation</option>
<option value="rest">Rest</option>
<option value="job">Job</option>
</select>
</div>
<div class="modal-footer">
<button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
<button class="btn btn-primary" onclick="saveAssignment()">Save</button>
</div>
</div>
</div>
</div>

<!-- EMPLOYEE MODAL -->
<div class="modal fade" id="editModal">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5>Add Employee</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">
<input id="empName" class="form-control mb-2" placeholder="Name">
<input id="empRole" class="form-control mb-2" placeholder="Role">
<input id="empCluster" class="form-control mb-2" placeholder="Cluster">
</div>
<div class="modal-footer">
<button class="btn btn-primary" onclick="saveEmployee()">Save</button>
</div>
</div>
</div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
let employees=[
{name:"Romero, Caesar",role:"WMA",cluster:"CLUSTER 2",restDays:["Sunday"],status:"Active"}
];

let schedules=JSON.parse(localStorage.getItem("schedules"))||[];
let currentWeek=0,selectedCells=[],assignContext=[];
const assignModal=document.getElementById("assignModal");

function renderTable(){
const tbody=document.getElementById("employeeTable");
tbody.innerHTML="";
employees.forEach((e,i)=>{
tbody.innerHTML+=`
<tr>
<td>${e.name}</td>
<td>${e.role}</td>
<td>${e.cluster}</td>
<td>${e.restDays.join(", ")}</td>
<td><span class="status-${e.status}">${e.status}</span></td>
<td><button class="btn btn-sm btn-outline-primary">Edit</button></td>
</tr>`;
});
}

function openAddModal(){}
function saveEmployee(){
bootstrap.Modal.getInstance(editModal).hide();
renderTable();
}

function getWeekDates(){
const start=new Date();
start.setDate(start.getDate()-start.getDay()+1+currentWeek*7);
return [...Array(7)].map((_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d;});
}

function renderScheduler(){
const grid=document.getElementById("schedulerGrid");
grid.innerHTML="";
const days=getWeekDates();
document.getElementById("weekLabel").innerText=days[0].toDateString()+" - "+days[6].toDateString();
days.forEach(d=>{
let h=document.createElement("div");
h.className="scheduler-header";
h.innerText=d.toLocaleDateString("en",{weekday:"short"});
grid.appendChild(h);
});
for(let r=0;r<6;r++){
days.forEach(d=>{
let c=document.createElement("div");
c.className="scheduler-cell";
c.dataset.date=d.toISOString().slice(0,10);
c.dataset.row=r;
c.onmousedown=()=>{selectedCells=[c];c.classList.add("dragging");};
c.onmouseup=()=>{assignContext=[...selectedCells];new bootstrap.Modal(assignModal).show();};
grid.appendChild(c);
});
}
}

function saveAssignment(){
assignContext.forEach(c=>{
schedules.push({date:c.dataset.date,row:c.dataset.row,type:assignType.value});
});
localStorage.setItem("schedules",JSON.stringify(schedules));
bootstrap.Modal.getInstance(assignModal).hide();
renderScheduler();
}

function prevWeek(){currentWeek--;renderScheduler();}
function nextWeek(){currentWeek++;renderScheduler();}

renderTable();
renderScheduler();
</script>
</body>
</html>
